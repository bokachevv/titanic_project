data:
  raw_train_path: "data/raw/train.csv"
  raw_test_path: "data/raw/test.csv"
  processed_train_path: "data/processed/train.csv"
  processed_test_path: "data/processed/test.csv"

validation:
  n_splits: 5
  random_state: 42

active_model: "logistic_regression"

models:
  logistic_regression:
    C: [0.001, 0.01, 0.1, 1.0, 10.0]
    max_iter: [1000]
  random_forest:
    n_estimators: [100, 200, 300]
    max_depth: [4, 6, 8, 10]
    random_state: [42]
  catboost:
    iterations: [300]
    depth: [6]
    learning_rate: [0.1]
    l2_leaf_reg: [10]
    verbose: [0]
    random_state: [42]
  neural_network:
    hidden_dim: 64
    batch_size: 32
    epochs: 50
    lr: 0.001
  voting_ensemble:
    model__voting: ['soft']